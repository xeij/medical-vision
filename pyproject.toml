[project]
name = "medical-vision"
version = "0.1.0"
description = "Do frozen CXR foundation-model embeddings generalize across hospitals better than fine-tuned CNNs?"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "pyyaml",
    "pydicom",
    "pylibjpeg[all]",
    "tqdm",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "open-clip-torch>=3.3.0",
    "timm>=1.0.30",
    "scikit-learn>=1.9.1",
    "faiss-cpu>=1.15.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "encoders", "heads", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
